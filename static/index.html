<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBiz | Business Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">S</div>
            <div>
                <div class="brand-name">SmartBiz</div>
                <div class="brand-tag">Business Manager</div>
            </div>
        </div>

        <nav class="nav">
            <div class="nav-label">Main</div>
            <button class="nav-item" data-page="dashboard">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>Dashboard</span>
            </button>

            <div class="nav-label">Inventory</div>
            <button class="nav-item" data-page="products">
                <svg viewBox="0 0 24 24"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>
                <span>Products</span>
            </button>
            <button class="nav-item" data-page="categories">
                <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                <span>Categories</span>
            </button>

            <div class="nav-label">People</div>
            <button class="nav-item" data-page="customers">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Customers</span>
            </button>
            <button class="nav-item" data-page="suppliers">
                <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                <span>Suppliers</span>
            </button>

            <div class="nav-label">Transactions</div>
            <button class="nav-item" data-page="orders">
                <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                <span>Sales / Bills</span>
            </button>
            <button class="nav-item" data-page="purchases">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>Purchases</span>
            </button>
            <button class="nav-item" data-page="payments">
                <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                <span>Payments</span>
            </button>
            <button class="nav-item" data-page="expenses">
                <svg viewBox="0 0 24 24"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>
                <span>Expenses</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <span id="serverDot" class="dot"></span>
            <span id="serverText">Connecting...</span>
        </div>
    </aside>

    <!-- ========== MAIN ========== -->
    <main class="main">
        <header class="topbar">
            <div>
                <h1 id="pageTitle">Dashboard</h1>
                <p id="pageSub"></p>
            </div>
            <div class="today" id="todayDate"></div>
        </header>

        <section id="content" class="content"></section>
    </main>

</div>

<!-- ========== MODAL ========== -->
<div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" id="modalBox">
        <div class="modal-header">
            <h3 id="modalTitle"></h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<div id="toastBox" class="toast-box"></div>

<script src="app.js"></script>
</body>
</html>
